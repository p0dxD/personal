apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podoi-website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/p0dxD/joserod.space.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: podoi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
