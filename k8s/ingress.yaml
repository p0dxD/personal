apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podoi-website
  namespace: podoi
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Uncomment to enable TLS with cert-manager:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
    - host: joserod.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podoi-website
                port:
                  number: 80
  # Uncomment to enable TLS:
  # tls:
  #   - hosts:
  #       - joserod.space
  #     secretName: podoi-website-tls
