# Deployed by rendimiento.ai (https://rendimiento.joserod.space).
# Pushes to main build and deploy; other branches only build.
services:
  - name: podoi-website
    path: .
    language: node
    port: 3000
    replicas: 2
    domain: joserod.space
    aliases: [www.joserod.space]
    tlsSecret: podoi-website-tls
    health: { path: / }
    # DATABASE_URL, RESEND_API_KEY, ... (kept in sync by its SealedSecret)
    secrets: [website-contact-secret]
    # The blog database: rendimiento's Postgres (DATABASE_URL is injected and
    # wins over the old value in website-contact-secret).
    needs: [postgres]
