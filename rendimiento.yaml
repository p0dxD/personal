# Deployed by rendimiento.ai (https://rendimiento.joserod.space).
# Pushes to main build and deploy; other branches only build.
services:
  - name: podoi-website
    path: .
    language: node
    port: 3000
    replicas: 2
    domain: joserod.space
    aliases: [www.joserod.space]
    tlsSecret: podoi-website-tls
    health: { path: / }
    # DATABASE_URL, RESEND_API_KEY, ... (kept in sync by its SealedSecret)
    secrets: [website-contact-secret]

  # The blog database: a ready-made image on its existing volume.
  - name: blog-postgres
    image: postgres:15-alpine
    port: 5432
    health: { tcp: true }
    env:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      PGDATA: /var/lib/postgresql/data/pgdata
    secretEnv:
      POSTGRES_PASSWORD: website-contact-secret/POSTGRES_PASSWORD
    volume:
      existingClaim: blog-postgres-pvc
      mount: /var/lib/postgresql/data
    # Creates the schema on an empty database (db/schema.sql).
    configFiles:
      - { configMap: blog-postgres-init, mount: /docker-entrypoint-initdb.d }
